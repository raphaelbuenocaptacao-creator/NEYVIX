name: NEYVIX Docs Safety Smoke

on:
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  docs-safety-smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEYVIX_PRODUCTION_CANDIDATE: https://neyvix.vercel.app
    steps:
      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vercel"
          token="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -r '.value // empty')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify Docs production boundaries
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -euo pipefail
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          probe() {
            local base="${1%/}"
            local code
            code="$(curl --silent --show-error --location --max-time 20 \
              "${headers[@]}" -o /tmp/health.json -w '%{http_code}' \
              "$base/api/health")"
            if [ "$code" = "200" ] && jq -e '.checks.database == "connected" and .readiness.access == true' /tmp/health.json >/dev/null 2>&1; then
              echo "$base"
              return 0
            fi
            return 1
          }

          base="$(probe "${NEYVIX_PRODUCTION_CANDIDATE}" || probe "${DEPLOYMENT_URL}")"
          test -n "$base"

          code="$(curl --silent --show-error --max-time 20 \
            "${headers[@]}" -D /tmp/docs-page.headers -o /dev/null -w '%{http_code}' \
            "$base/docs")"
          echo "Docs page without session HTTP: $code"
          test "$code" = "307" -o "$code" = "308"
          grep -Eiq '^location: .*\/login\?next=(%2Fdocs|/docs)' /tmp/docs-page.headers

          code="$(curl --silent --show-error --max-time 20 \
            "${headers[@]}" -D /tmp/docs-api.headers -o /tmp/docs-api.json -w '%{http_code}' \
            "$base/api/docs")"
          echo "Docs API without session HTTP: $code"
          test "$code" = "401"
          grep -Eiq '^cache-control: .*no-store' /tmp/docs-api.headers
          grep -Eiq '^referrer-policy: no-referrer' /tmp/docs-api.headers

          code="$(curl --silent --show-error --location --max-time 20 \
            "${headers[@]}" -o /tmp/health-docs.json -w '%{http_code}' \
            "$base/api/health")"
          echo "Health HTTP: $code"
          test "$code" = "200"
          jq -e '.checks.schema.docs == "ready"' /tmp/health-docs.json >/dev/null
