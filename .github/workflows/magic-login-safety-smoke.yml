name: NEYVIX Magic Login Safety Smoke

on:
  deployment_status:

permissions:
  contents: read

jobs:
  magic-login-safety-smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEYVIX_PRODUCTION_URL: https://neyvix.vercel.app
    steps:
      - name: Verify magic-login request privacy and session safety
        shell: bash
        run: |
          set -euo pipefail
          base="${NEYVIX_PRODUCTION_URL%/}"
          cookie_jar="/tmp/neyvix-magic-cookies.txt"
          rm -f "$cookie_jar"

          header_value() {
            local name="$1" file="$2"
            awk -v target="$name" 'BEGIN{IGNORECASE=1} $0 ~ "^" target ":" {gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); value=$0} END{print value}' "$file"
          }

          request_magic() {
            local email="$1" prefix="$2"
            curl --silent --show-error \
              --retry 2 --retry-delay 1 --max-time 20 \
              -H 'content-type: application/x-www-form-urlencoded' \
              -c "$cookie_jar" \
              -D "/tmp/${prefix}.headers" \
              -o "/tmp/${prefix}.body" \
              -w '%{http_code}' \
              --data-urlencode "email=${email}" \
              "$base/api/auth/magic-login/request"
          }

          invalid_code="$(request_magic 'not-an-email' invalid)"
          invalid_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/invalid.headers)"
          invalid_location="$(header_value location /tmp/invalid.headers)"
          invalid_cache="$(header_value cache-control /tmp/invalid.headers)"
          invalid_referrer="$(header_value referrer-policy /tmp/invalid.headers)"

          echo "Invalid magic request HTTP: ${invalid_status:-$invalid_code}"
          test "${invalid_status:-$invalid_code}" = "303"
          case "$invalid_location" in
            */login?magic=invalid*) ;;
            *) echo "Unexpected invalid-email redirect: $invalid_location" >&2; exit 1 ;;
          esac
          case "${invalid_cache,,}" in
            *no-store*) ;;
            *) echo "Magic request must be non-cacheable: $invalid_cache" >&2; exit 1 ;;
          esac
          test "${invalid_referrer,,}" = "no-referrer"
          if grep -Eiq '^set-cookie: neyvix_session=' /tmp/invalid.headers; then
            echo "Security regression: invalid magic request issued a session cookie." >&2
            exit 1
          fi

          unknown_email="neyvix-magic-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@invalid.example"
          unknown_code="$(request_magic "$unknown_email" unknown)"
          unknown_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/unknown.headers)"
          unknown_location="$(header_value location /tmp/unknown.headers)"
          unknown_cache="$(header_value cache-control /tmp/unknown.headers)"
          unknown_referrer="$(header_value referrer-policy /tmp/unknown.headers)"

          echo "Unknown-account magic request HTTP: ${unknown_status:-$unknown_code}"
          test "${unknown_status:-$unknown_code}" = "303"
          # An unknown account may report sent when delivery is configured, or
          # unavailable when the transport itself is unavailable. It must never
          # expose an account-not-found/invalid-account distinction.
          case "$unknown_location" in
            */login?magic=sent*|*/login?magic=unavailable*) ;;
            *) echo "Magic request leaked an unexpected account state: $unknown_location" >&2; exit 1 ;;
          esac
          case "${unknown_cache,,}" in
            *no-store*) ;;
            *) echo "Unknown-account magic response must be non-cacheable: $unknown_cache" >&2; exit 1 ;;
          esac
          test "${unknown_referrer,,}" = "no-referrer"
          if grep -Eiq '^set-cookie: neyvix_session=' /tmp/unknown.headers; then
            echo "Security regression: magic-link request itself issued a session cookie." >&2
            exit 1
          fi

          me_code="$(curl --silent --show-error \
            --retry 2 --retry-delay 1 --max-time 20 \
            -b "$cookie_jar" \
            -D /tmp/me.headers \
            -o /tmp/me.json \
            -w '%{http_code}' \
            "$base/api/auth/me")"
          echo "Session after magic request HTTP: $me_code"
          test "$me_code" = "401"
          jq -e '.authenticated == false' /tmp/me.json >/dev/null
          if grep -Eiq '^set-cookie: neyvix_session=' /tmp/me.headers; then
            echo "Security regression: identity check after magic request issued a session cookie." >&2
            exit 1
          fi

          malformed_code="$(curl --silent --show-error \
            --retry 2 --retry-delay 1 --max-time 20 \
            -D /tmp/malformed.headers \
            -o /tmp/malformed.body \
            -w '%{http_code}' \
            --get --data-urlencode 'token=invalid' \
            "$base/api/auth/magic-login")"
          malformed_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/malformed.headers)"
          malformed_location="$(header_value location /tmp/malformed.headers)"
          echo "Malformed magic token HTTP: ${malformed_status:-$malformed_code}"
          test "${malformed_status:-$malformed_code}" = "303"
          case "$malformed_location" in
            */login?error=invalid*) ;;
            *) echo "Unexpected malformed-token redirect: $malformed_location" >&2; exit 1 ;;
          esac
          if grep -Eiq '^set-cookie: neyvix_session=' /tmp/malformed.headers; then
            echo "Security regression: malformed magic token issued a session cookie." >&2
            exit 1
          fi

          echo "PASS: magic-login request preserves privacy, never creates a session, and malformed tokens fail closed."
