name: NEYVIX Auth Negative Smoke

on:
  deployment_status:

permissions:
  contents: read

jobs:
  auth-negative-smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEYVIX_PRODUCTION_URL: https://neyvix.vercel.app
    steps:
      - name: Verify failed login, reset and logout session safety
        shell: bash
        run: |
          set -euo pipefail
          base="${NEYVIX_PRODUCTION_URL%/}"
          bogus_email="neyvix-auth-smoke-${GITHUB_RUN_ID}@invalid.example"
          bogus_password="NEYVIX-invalid-${GITHUB_RUN_ATTEMPT}-do-not-use"

          code="$(curl --silent --show-error \
            --retry 2 --retry-delay 1 --max-time 20 \
            -H 'content-type: application/x-www-form-urlencoded' \
            -c /tmp/cookies.txt \
            -D /tmp/login.headers \
            -o /tmp/login.body \
            -w '%{http_code}' \
            --data-urlencode "email=${bogus_email}" \
            --data-urlencode "password=${bogus_password}" \
            --data-urlencode 'next=/dashboard' \
            "$base/api/auth/login")"

          status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/login.headers)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); print $0}' /tmp/login.headers | tail -1)"
          cache_control="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/{gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); print $0}' /tmp/login.headers | tail -1)"
          referrer_policy="$(awk 'BEGIN{IGNORECASE=1} /^referrer-policy:/{gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); print $0}' /tmp/login.headers | tail -1)"

          echo "Invalid login HTTP: ${status:-$code}"
          test "${status:-$code}" = "303"
          case "$location" in
            */login?error=invalid*) ;;
            *) echo "Unexpected invalid-login redirect: $location" >&2; exit 1 ;;
          esac
          case "${cache_control,,}" in
            *no-store*) ;;
            *) echo "Invalid login must be non-cacheable: $cache_control" >&2; exit 1 ;;
          esac
          test "${referrer_policy,,}" = "no-referrer"

          if grep -Eiq '^set-cookie: neyvix_session=' /tmp/login.headers; then
            echo "Security regression: invalid login issued a NEYVIX session cookie." >&2
            exit 1
          fi

          me_code="$(curl --silent --show-error \
            --retry 2 --retry-delay 1 --max-time 20 \
            -b /tmp/cookies.txt \
            -D /tmp/me.headers \
            -o /tmp/me.json \
            -w '%{http_code}' \
            "$base/api/auth/me")"

          echo "Post-failure session HTTP: $me_code"
          test "$me_code" = "401"
          jq -e '.authenticated == false' /tmp/me.json >/dev/null
          if grep -Eiq '^set-cookie: neyvix_session=' /tmp/me.headers; then
            echo "Security regression: unauthenticated identity check issued a session cookie." >&2
            exit 1
          fi

          reset_code="$(curl --silent --show-error \
            --retry 2 --retry-delay 1 --max-time 20 \
            -H 'content-type: application/x-www-form-urlencoded' \
            -D /tmp/reset.headers \
            -o /tmp/reset.body \
            -w '%{http_code}' \
            --data-urlencode 'token=neyvix-invalid-reset-token-0000000000000000' \
            --data-urlencode 'password=NEYVIX-smoke-reset-password-0001' \
            --data-urlencode 'confirmPassword=NEYVIX-smoke-reset-password-0001' \
            "$base/api/auth/reset-password")"

          reset_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/reset.headers)"
          reset_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); print $0}' /tmp/reset.headers | tail -1)"
          reset_cache="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/{gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); print $0}' /tmp/reset.headers | tail -1)"
          reset_referrer="$(awk 'BEGIN{IGNORECASE=1} /^referrer-policy:/{gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); print $0}' /tmp/reset.headers | tail -1)"

          echo "Invalid reset HTTP: ${reset_status:-$reset_code}"
          test "${reset_status:-$reset_code}" = "303"
          case "$reset_location" in
            */reset-password?status=invalid*) ;;
            *) echo "Unexpected invalid-reset redirect: $reset_location" >&2; exit 1 ;;
          esac
          case "${reset_cache,,}" in
            *no-store*) ;;
            *) echo "Password reset response must be non-cacheable: $reset_cache" >&2; exit 1 ;;
          esac
          test "${reset_referrer,,}" = "no-referrer"
          if grep -Eiq '^set-cookie: neyvix_session=' /tmp/reset.headers; then
            echo "Security regression: invalid password reset issued a NEYVIX session cookie." >&2
            exit 1
          fi

          logout_code="$(curl --silent --show-error \
            --retry 2 --retry-delay 1 --max-time 20 \
            -X POST \
            -H 'Cookie: neyvix_session=synthetic-residual-session' \
            -D /tmp/logout.headers \
            -o /tmp/logout.body \
            -w '%{http_code}' \
            "$base/api/auth/logout")"

          logout_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/logout.headers)"
          logout_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); print $0}' /tmp/logout.headers | tail -1)"
          logout_cache="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/{gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); print $0}' /tmp/logout.headers | tail -1)"
          logout_referrer="$(awk 'BEGIN{IGNORECASE=1} /^referrer-policy:/{gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); print $0}' /tmp/logout.headers | tail -1)"

          echo "Logout HTTP: ${logout_status:-$logout_code}"
          test "${logout_status:-$logout_code}" = "303"
          case "$logout_location" in
            */login*) ;;
            *) echo "Unexpected logout redirect: $logout_location" >&2; exit 1 ;;
          esac
          case "${logout_cache,,}" in
            *no-store*) ;;
            *) echo "Logout must be non-cacheable: $logout_cache" >&2; exit 1 ;;
          esac
          test "${logout_referrer,,}" = "no-referrer"
          if ! grep -Eiq '^set-cookie: neyvix_session=.*(Max-Age=0|Expires=Thu, 01 Jan 1970)' /tmp/logout.headers; then
            echo "Security regression: logout did not explicitly clear neyvix_session." >&2
            exit 1
          fi

          echo "PASS: failed login/reset never created a session and logout clears residual session state."
