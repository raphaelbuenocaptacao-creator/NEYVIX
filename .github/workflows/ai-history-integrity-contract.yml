name: NEYVIX AI History Integrity Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ai-history-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify complete AI exchanges, isolation and deterministic history
        shell: bash
        run: |
          set -euo pipefail
          route="app/api/ai/route.ts"
          history_route="app/api/ai/history/route.ts"
          exchange="lib/ai-exchange.ts"
          history="lib/ai-history.ts"

          test -f "$route"
          test -f "$history_route"
          test -f "$exchange"
          test -f "$history"

          grep -F 'import { saveAiExchange } from "@/lib/ai-exchange";' "$route" >/dev/null
          grep -F 'const answer = extractGatewayAnswer(upstream, text);' "$route" >/dev/null
          grep -F 'await saveAiExchange(session.email, prompt, answer)' "$route" >/dev/null
          if grep -F 'saveAiMessage(' "$route" >/dev/null; then
            echo 'AI route must not persist individual turns independently.' >&2
            exit 1
          fi
          if grep -F 'saveAiExchange(session.email, prompt, text)' "$route" >/dev/null; then
            echo 'AI route must never persist the raw upstream envelope.' >&2
            exit 1
          fi

          upstream_line="$(grep -n 'if (!upstream.ok)' "$route" | head -n1 | cut -d: -f1)"
          normalization_line="$(grep -n 'const answer = extractGatewayAnswer(upstream, text);' "$route" | head -n1 | cut -d: -f1)"
          persistence_line="$(grep -n 'await saveAiExchange(session.email, prompt, answer)' "$route" | head -n1 | cut -d: -f1)"
          test -n "$upstream_line"
          test -n "$normalization_line"
          test -n "$persistence_line"
          [ "$normalization_line" -gt "$upstream_line" ] || {
            echo 'Gateway response must only be normalized after a successful upstream response.' >&2
            exit 1
          }
          [ "$persistence_line" -gt "$normalization_line" ] || {
            echo 'AI exchange must only be persisted after gateway response normalization.' >&2
            exit 1
          }

          grep -F 'WITH target_user AS (' "$exchange" >/dev/null
          grep -F 'AND is_active = true' "$exchange" >/dev/null
          grep -F 'exchange(ordinal, role, content) AS (' "$exchange" >/dev/null
          grep -F "(0, 'user'::text" "$exchange" >/dev/null
          grep -F "(1, 'assistant'::text" "$exchange" >/dev/null
          grep -F 'INSERT INTO public.neyvix_ai_messages (user_id, role, content, created_at)' "$exchange" >/dev/null
          grep -F "statement_timestamp() + (exchange.ordinal * interval '1 microsecond')" "$exchange" >/dev/null
          grep -F 'if (rows.length !== 2)' "$exchange" >/dev/null
          grep -F 'const insertedIds = rows.map' "$exchange" >/dev/null
          grep -F 'await getAiMessagesByIds(normalizedEmail, [insertedIds[0], insertedIds[1]])' "$exchange" >/dev/null
          grep -F 'if (reread.length !== 2)' "$exchange" >/dev/null
          grep -F 'const byRole = new Map' "$exchange" >/dev/null
          grep -F 'const persistedUser = byRole.get("user")' "$exchange" >/dev/null
          grep -F 'const persistedAssistant = byRole.get("assistant")' "$exchange" >/dev/null
          grep -F 'persistedUser.content !== userContent || persistedAssistant.content !== assistantContent' "$exchange" >/dev/null
          grep -F 'persistedUser.id === persistedAssistant.id' "$exchange" >/dev/null
          grep -F 'Date.parse(persistedUser.createdAt)' "$exchange" >/dev/null
          grep -F 'return persisted.sort((a, b) => a.createdAt.localeCompare(b.createdAt))' "$exchange" >/dev/null

          # History remains scoped to the authenticated active owner.
          grep -F 'JOIN public.users u ON u.id = m.user_id' "$history" >/dev/null
          grep -F 'WHERE u.email = ${normalizedEmail}' "$history" >/dev/null
          grep -F 'AND u.is_active = true' "$history" >/dev/null
          grep -F "AND m.role IN ('user', 'assistant', 'system')" "$history" >/dev/null

          # Pagination must be stable even if multiple messages share created_at.
          grep -F 'SELECT m.id::text AS id, m.role, m.content, m.created_at' "$history" >/dev/null
          grep -F 'ORDER BY m.created_at DESC, m.id DESC' "$history" >/dev/null
          grep -F 'm.created_at = ${before.createdAt}::timestamptz' "$history" >/dev/null
          grep -F 'm.id < ${before.id}::uuid' "$history" >/dev/null
          grep -F 'const fetchLimit = limit + 1' "$history" >/dev/null
          grep -F 'const hasMore = rows.length > limit' "$history" >/dev/null
          grep -F 'nextCursor' "$history" >/dev/null

          # Dedicated history endpoint must preserve auth, entitlement and cursor validation.
          grep -F 'readActiveSession' "$history_route" >/dev/null
          grep -F 'getProductAccess(session.email, "ai")' "$history_route" >/dev/null
          grep -F 'if (before && !validCursor(before))' "$history_route" >/dev/null
          grep -F 'listAiHistoryPage(session.email, { limit, before })' "$history_route" >/dev/null
          grep -F '"Cache-Control": "no-store, max-age=0"' "$history_route" >/dev/null

          echo 'PASS: AI exchanges stay complete and normalized; authoritative reread and paginated history remain owner-scoped, deterministic and cursor-validated.'
