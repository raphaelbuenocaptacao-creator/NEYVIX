name: NEYVIX Production Smoke

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve production URL
        id: target
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          case "$base" in
            https://*) ;;
            *) echo "Deployment URL must use HTTPS" >&2; exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Testing deployment host: ${base#https://}"

      - name: Check health
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 20 \
            -o /tmp/health.json -w '%{http_code}' \
            "${{ steps.target.outputs.base }}/api/health")"
          echo "Health HTTP: $code"
          if jq -e . /tmp/health.json >/dev/null 2>&1; then
            jq '{service,status,readiness,checks:{database:.checks.database,project:.checks.project,auth:.checks.auth,schema:.checks.schema,integrations:.checks.integrations}}' /tmp/health.json
          else
            echo "Health response was not JSON (possible deployment protection or routing issue)." >&2
            exit 1
          fi
          test "$code" = "200"
          jq -e '.checks.database == "connected" and .checks.project == "ready" and .checks.auth == "ready" and .readiness.access == true' /tmp/health.json >/dev/null

      - name: Check access readiness
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 20 \
            -o /tmp/status.json -w '%{http_code}' \
            "${{ steps.target.outputs.base }}/api/status")"
          echo "Status HTTP: $code"
          if jq -e . /tmp/status.json >/dev/null 2>&1; then
            jq '{ok,readiness,access}' /tmp/status.json
          else
            echo "Status response was not JSON." >&2
            exit 1
          fi
          test "$code" = "200"
          jq -e '.ok == true and .readiness.access == true and .access.canonicalUrlResolved == true' /tmp/status.json >/dev/null

      - name: Check login page
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 20 \
            -o /tmp/login.html -w '%{http_code}' \
            "${{ steps.target.outputs.base }}/login")"
          echo "Login HTTP: $code"
          test "$code" = "200"
          test -s /tmp/login.html

      - name: Check unauthenticated session boundary
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 20 \
            -o /tmp/me.json -w '%{http_code}' \
            "${{ steps.target.outputs.base }}/api/auth/me")"
          echo "Session boundary HTTP: $code"
          test "$code" = "401"
          jq -e '.authenticated == false' /tmp/me.json >/dev/null
