name: NEYVIX Production Smoke

on:
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEYVIX_PRODUCTION_CANDIDATE: https://neyvix.vercel.app
    steps:
      - name: Resolve deployment URL
        id: target
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          case "$base" in
            https://*) ;;
            *) echo "Deployment URL must use HTTPS" >&2; exit 1 ;;
          esac
          echo "deployment=$base" >> "$GITHUB_OUTPUT"
          echo "Deployment host: ${base#https://}"

      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vercel"
          token="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -r '.value // empty')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Select reachable production host
        id: access
        shell: bash
        run: |
          set -euo pipefail

          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          probe() {
            local label="$1"
            local base="$2"
            local body="/tmp/${label}.health.body"
            local hdr="/tmp/${label}.health.headers"
            local code
            code="$(curl --silent --show-error --location \
              --retry 2 --retry-delay 1 --max-time 20 \
              "${headers[@]}" \
              -D "$hdr" -o "$body" -w '%{http_code}' \
              "${base}/api/health")"
            local content_type
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); value=$0} END{print value}' "$hdr")"
            echo "$label HTTP: $code; content-type: ${content_type:-unknown}"

            if jq -e . "$body" >/dev/null 2>&1; then
              if [ "$code" = "200" ] && jq -e '.checks.database == "connected" and .checks.project == "ready" and .checks.auth == "ready" and .readiness.access == true' "$body" >/dev/null; then
                jq '{service,status,readiness,checks:{database:.checks.database,project:.checks.project,auth:.checks.auth}}' "$body"
                echo "base=$base" >> "$GITHUB_OUTPUT"
                echo "source=$label" >> "$GITHUB_OUTPUT"
                return 0
              fi
              echo "$label reached NEYVIX JSON but access readiness is not healthy." >&2
              jq '{service,status,readiness,checks:{database:.checks.database,project:.checks.project,auth:.checks.auth}}' "$body" >&2
              return 3
            fi

            if grep -Eiq 'vercel|authentication|required|deployment protection|log in|sign in' "$body"; then
              echo "$label is intercepted by Vercel Deployment Protection." >&2
              return 2
            fi

            echo "$label returned a non-JSON response before NEYVIX health could be verified." >&2
            return 1
          }

          if probe "production" "${NEYVIX_PRODUCTION_CANDIDATE%/}"; then
            exit 0
          fi
          production_rc=$?

          if probe "deployment" "${{ steps.target.outputs.deployment }}"; then
            exit 0
          fi
          deployment_rc=$?

          if [ "$production_rc" = "2" ] || [ "$deployment_rc" = "2" ]; then
            echo "NEYVIX_BLOCKER=VERCEL_DEPLOYMENT_PROTECTION" >&2
            echo "Neither the stable production alias nor this deployment could reach NEYVIX health without Vercel interception." >&2
            exit 2
          fi

          echo "NEYVIX_BLOCKER=PRODUCTION_HEALTH_UNREACHABLE" >&2
          exit 1

      - name: Check access readiness
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.access.outputs.base }}"
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          code="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 20 \
            "${headers[@]}" \
            -o /tmp/status.json -w '%{http_code}' \
            "$base/api/status")"
          echo "Status HTTP: $code"
          jq -e . /tmp/status.json >/dev/null
          jq '{ok,readiness,access}' /tmp/status.json
          test "$code" = "200"
          jq -e '.ok == true and .readiness.access == true and .readiness.canonicalUrlResolved == true' /tmp/status.json >/dev/null

      - name: Check login page
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.access.outputs.base }}"
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          code="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 20 \
            "${headers[@]}" \
            -o /tmp/login.html -w '%{http_code}' \
            "$base/login")"
          echo "Login HTTP: $code"
          test "$code" = "200"
          test -s /tmp/login.html

      - name: Check public registration page
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.access.outputs.base }}"
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          code="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 20 \
            "${headers[@]}" \
            -o /tmp/register.html -w '%{http_code}' \
            "$base/register")"
          echo "Register HTTP: $code"
          test "$code" = "200"
          test -s /tmp/register.html

      - name: Check magic-login invalid-token boundary
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.access.outputs.base }}"
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          code="$(curl --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 20 \
            "${headers[@]}" \
            -D /tmp/magic.headers -o /dev/null -w '%{http_code}' \
            "$base/api/auth/magic-login")"
          echo "Magic login boundary HTTP: $code"
          test "$code" = "303"
          grep -Eiq '^location: .*\/login\?error=invalid' /tmp/magic.headers

      - name: Check unauthenticated session boundary
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.access.outputs.base }}"
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          code="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 20 \
            "${headers[@]}" \
            -o /tmp/me.json -w '%{http_code}' \
            "$base/api/auth/me")"
          echo "Session boundary HTTP: $code"
          test "$code" = "401"
          jq -e '.authenticated == false' /tmp/me.json >/dev/null
