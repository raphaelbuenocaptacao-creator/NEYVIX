name: NEYVIX Chat Safety Smoke

on:
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  chat-safety-smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEYVIX_PRODUCTION_CANDIDATE: https://neyvix.vercel.app
    steps:
      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vercel"
          token="$(curl --silent --show-error --fail \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" | jq -r '.value // empty')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify Chat production boundaries
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -euo pipefail
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          probe() {
            local base="${1%/}"
            local code
            code="$(curl --silent --show-error --location --max-time 20 \
              "${headers[@]}" -o /tmp/health.json -w '%{http_code}' \
              "$base/api/health")"
            if [ "$code" = "200" ] && jq -e '.checks.database == "connected" and .readiness.access == true' /tmp/health.json >/dev/null 2>&1; then
              echo "$base"
              return 0
            fi
            return 1
          }

          base="$(probe "${NEYVIX_PRODUCTION_CANDIDATE}" || probe "${DEPLOYMENT_URL}")"
          test -n "$base"

          code="$(curl --silent --show-error --max-time 20 \
            "${headers[@]}" -D /tmp/chat-page.headers -o /dev/null -w '%{http_code}' \
            "$base/chat")"
          echo "Chat page without session HTTP: $code"
          test "$code" = "307" -o "$code" = "308"
          grep -Eiq '^location: .*\/login\?next=(%2Fchat|/chat)' /tmp/chat-page.headers

          code="$(curl --silent --show-error --max-time 20 \
            "${headers[@]}" -D /tmp/chat-get.headers -o /tmp/chat-get.json -w '%{http_code}' \
            "$base/api/chat")"
          echo "Chat GET without session HTTP: $code"
          test "$code" = "401"
          grep -Eiq '^cache-control: .*no-store' /tmp/chat-get.headers
          grep -Eiq '^referrer-policy: no-referrer' /tmp/chat-get.headers

          code="$(curl --silent --show-error --max-time 20 \
            "${headers[@]}" -H 'content-type: application/json' \
            -d '{"recipientEmail":"nobody@example.invalid","text":"must-not-write"}' \
            -D /tmp/chat-post.headers -o /tmp/chat-post.json -w '%{http_code}' \
            "$base/api/chat")"
          echo "Chat POST without session HTTP: $code"
          test "$code" = "401"
          grep -Eiq '^cache-control: .*no-store' /tmp/chat-post.headers
          grep -Eiq '^referrer-policy: no-referrer' /tmp/chat-post.headers

          code="$(curl --silent --show-error --location --max-time 20 \
            "${headers[@]}" -o /tmp/status-chat.json -w '%{http_code}' \
            "$base/api/status")"
          echo "Status HTTP: $code"
          test "$code" = "200"
          jq -e '.moduleMaturity.chat.stage == "partial"' /tmp/status-chat.json >/dev/null
