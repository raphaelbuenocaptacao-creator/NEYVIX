name: NEYVIX AI Memory Privacy Contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ai-memory-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify AI only recalls eligible memory from the authenticated user
        shell: bash
        run: |
          set -euo pipefail

          ai_route="app/api/ai/route.ts"
          context_route="app/api/ai/context/route.ts"
          context_assembler="lib/ai-memory-context.ts"
          memory_db="lib/memory-db.ts"

          test -f "$ai_route"
          test -f "$context_route"
          test -f "$context_assembler"
          test -f "$memory_db"

          # The production AI route and provider-free readiness probe must use the same assembler.
          grep -F 'loadAiMemoryContext(session.email, useMemory, 8)' "$ai_route" >/dev/null
          grep -F 'loadAiMemoryContext(session.email, true, 8)' "$context_route" >/dev/null

          # AI memory is fail-closed: both the request and the server feature flag must explicitly opt in.
          grep -F 'if (!useMemory || !isAiMemoryContextEnabled()) return [];' "$context_assembler" >/dev/null
          grep -F 'return process.env.NEYVIX_MEMORY_AI_CONTEXT === "true";' "$context_assembler" >/dev/null
          if grep -F 'explicitlyDisabled' "$context_assembler" >/dev/null; then
            echo 'AI memory context must not default to enabled when the feature flag is absent.' >&2
            exit 1
          fi
          grep -F 'getMemoryContext(email, limit)' "$context_assembler" >/dev/null

          # Memory values supplied to AI remain bounded even if a stored memory is larger.
          grep -F 'value: item.value.slice(0, MAX_MEMORY_VALUE_LENGTH)' "$context_assembler" >/dev/null

          # The memory query must scope records to the current account and active user.
          grep -F 'WHERE lower(u.email) = ${email.trim().toLowerCase()}' "$memory_db" >/dev/null
          grep -F 'AND u.is_active = true' "$memory_db" >/dev/null

          # Private and expired memories must never be supplied to NEYVIX AI.
          grep -F 'AND m.is_private = false' "$memory_db" >/dev/null
          grep -F 'AND (m.expires_at IS NULL OR m.expires_at > now())' "$memory_db" >/dev/null

          # Recall must be auditable without leaking raw memory values into event metadata.
          grep -F "'recall', 'neyvix-ai'" "$memory_db" >/dev/null
          grep -F "jsonb_build_object('key', memory_key::text, 'category', category::text)" "$memory_db" >/dev/null

          # Payload sent upstream must use the pseudonymous gateway identity, not raw email.
          grep -F 'user: gatewayUserId(session.email)' "$ai_route" >/dev/null
          if grep -Eq 'context:[[:space:]]*\{[^}]*email[[:space:]]*:' "$ai_route"; then
            echo 'Raw email must not be included in the AI gateway context.' >&2
            exit 1
          fi

          # Readiness must expose only aggregate state, never memory records or values.
          grep -F 'memoryUsed: memory.length' "$context_route" >/dev/null
          if grep -Eq 'NextResponse\.json\([^)]*(memory|value)[[:space:]]*:' "$context_route"; then
            echo 'AI Memory readiness must not return raw memory content.' >&2
            exit 1
          fi

          echo 'PASS: explicit opt-in, ownership, privacy, expiration, bounded context and pseudonymous AI contract verified.'
