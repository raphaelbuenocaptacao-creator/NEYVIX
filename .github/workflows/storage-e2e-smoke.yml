name: NEYVIX Storage E2E Smoke

on:
  push:
    branches: [main]
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  storage-e2e:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEYVIX_PRODUCTION_URL: https://neyvix.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vercel"
          token="$(curl --silent --show-error --fail -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value // empty')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify private Storage lifecycle in production
        shell: bash
        run: |
          set -euo pipefail
          base="${NEYVIX_PRODUCTION_URL%/}"
          cookies=/tmp/neyvix-storage-cookies.txt
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          fail_stage() {
            local stage="$1"
            echo "NEYVIX_STORAGE_STAGE_FAIL=$stage" >&2
            echo "::error title=NEYVIX Storage E2E::${stage}"
            {
              echo "### Storage E2E Smoke: FAIL"
              echo
              echo "- Stage: \`$stage\`"
              echo "- Production: \`$base\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          account_registered=false
          file_id=""
          cleanup() {
            set +e
            if [ "$account_registered" = true ] && [ -s "$cookies" ]; then
              if [ -n "$file_id" ]; then
                curl --silent --max-time 15 "${headers[@]}" -b "$cookies" -X DELETE "$base/api/storage/$file_id" >/dev/null 2>&1 || true
              fi
              curl --silent --max-time 15 "${headers[@]}" -b "$cookies" -X DELETE "$base/api/auth/smoke-cleanup" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          anonymous_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/storage-anon.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"name":"x.txt","contentBase64":"eA=="}' "$base/api/storage")" || fail_stage anonymous-request
          [ "$anonymous_code" = "401" ] || fail_stage anonymous-isolation

          release_ready=false
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/health.json -w '%{http_code}' "$base/api/health" || true)"
            served_sha="$(jq -r '.release.sha // empty' /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && { [ "$served_sha" = "$GITHUB_SHA" ] || [[ "$GITHUB_SHA" == "$served_sha"* ]]; }; then
              release_ready=true
              break
            fi
            sleep 10
          done
          [ "$release_ready" = true ] || fail_stage production-release-sha-timeout
          jq -e '.checks.database == "connected" and .readiness.access == true' /tmp/health.json >/dev/null || fail_stage database-health

          handle="e2e-smoke-storage-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          email="${handle}@neyvix.com"
          password="$(openssl rand -base64 30 | tr -d '\n')"
          echo "::add-mask::$password"
          echo "::add-mask::$email"

          curl --silent --show-error --max-time 20 "${headers[@]}" \
            -H 'content-type: application/x-www-form-urlencoded' \
            -c "$cookies" -D /tmp/register.headers -o /tmp/register.body \
            --data-urlencode 'name=NEYVIX Storage E2E' \
            --data-urlencode "handle=$handle" \
            --data-urlencode "password=$password" \
            --data-urlencode 'plan=start' \
            "$base/api/auth/register" >/dev/null || fail_stage register-request
          register_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/register.headers)"
          [ "$register_status" = "303" ] || fail_stage register-status
          grep -Eq 'neyvix_session' "$cookies" || fail_stage session-cookie
          account_registered=true

          filename="storage-smoke-${GITHUB_RUN_ID}.txt"
          text="NEYVIX private storage smoke ${GITHUB_RUN_ID}"
          content_base64="$(printf '%s' "$text" | base64 -w0)"
          expected_sha="$(printf '%s' "$text" | sha256sum | awk '{print $1}')"

          upload_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" \
            -H 'content-type: application/json' -o /tmp/storage-upload.json -w '%{http_code}' \
            --data "$(jq -nc --arg name "$filename" --arg mime 'text/plain; charset=utf-8' --arg content "$content_base64" '{name:$name,mimeType:$mime,contentBase64:$content}')" \
            "$base/api/storage")" || fail_stage upload-request
          [ "$upload_code" = "201" ] || fail_stage upload-status
          jq -e --arg name "$filename" --arg sha "$expected_sha" '.file.name == $name and .file.checksumSha256 == $sha and (.file.id | type == "string") and (.file.storageKey | type == "string")' /tmp/storage-upload.json >/dev/null || fail_stage upload-payload
          file_id="$(jq -r '.file.id' /tmp/storage-upload.json)"

          list_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -o /tmp/drive-list.json -w '%{http_code}' "$base/api/drive")" || fail_stage drive-list-request
          [ "$list_code" = "200" ] || fail_stage drive-list-status
          jq -e --arg id "$file_id" --arg name "$filename" 'any(.items[]; .id == $id and .name == $name and .kind == "file" and (.storageKey | type == "string"))' /tmp/drive-list.json >/dev/null || fail_stage drive-file-persistence

          download_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -D /tmp/storage-download.headers -o /tmp/storage-download.bin -w '%{http_code}' "$base/api/storage/$file_id")" || fail_stage download-request
          [ "$download_code" = "200" ] || fail_stage download-status
          cmp -s <(printf '%s' "$text") /tmp/storage-download.bin || fail_stage download-bytes
          grep -Eiq '^cache-control: .*no-store' /tmp/storage-download.headers || fail_stage download-private-cache-control
          grep -Eiq "^x-neyvix-sha256: ${expected_sha}" /tmp/storage-download.headers || fail_stage download-checksum-header

          delete_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -X DELETE -o /tmp/storage-delete.json -w '%{http_code}' "$base/api/storage/$file_id")" || fail_stage delete-request
          [ "$delete_code" = "200" ] || fail_stage delete-status
          jq -e '.ok == true' /tmp/storage-delete.json >/dev/null || fail_stage delete-payload
          deleted_id="$file_id"
          file_id=""

          verify_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -o /tmp/drive-verify.json -w '%{http_code}' "$base/api/drive")" || fail_stage delete-verify-request
          [ "$verify_code" = "200" ] || fail_stage delete-verify-status
          jq -e --arg id "$deleted_id" 'all(.items[]; .id != $id)' /tmp/drive-verify.json >/dev/null || fail_stage delete-persistence

          cleanup_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -X DELETE -o /tmp/smoke-cleanup.json -w '%{http_code}' "$base/api/auth/smoke-cleanup")" || fail_stage smoke-account-cleanup-request
          [ "$cleanup_code" = "200" ] || fail_stage smoke-account-cleanup-status
          jq -e '.ok == true' /tmp/smoke-cleanup.json >/dev/null || fail_stage smoke-account-cleanup-payload
          account_registered=false

          {
            echo "### Storage E2E Smoke: PASS"
            echo
            echo "Verified anonymous denial, release SHA, NEYVIX ID/session, private upload, Drive metadata persistence, byte-exact download, SHA-256 integrity, delete persistence, private cache headers, and ephemeral-account cleanup."
            echo "Storage smoke is limited to a tiny generated text payload and performs no external upload, billing mutation, payment, mail delivery, webhook, AI generation or schema migration."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: private Storage lifecycle verified in production."
