name: NEYVIX Session Secret Safety Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - security/explicit-session-secret-v2
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  production-session-secret-preflight:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: https://neyvix.vercel.app
    steps:
      - name: Verify dedicated session secret on current production
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_URL%/}"
          health=/tmp/identity-health.json
          safe=/tmp/identity-health-safe.json

          code="$(curl --silent --show-error --max-time 20 -o "$health" -w '%{http_code}' "$base/api/health/identity")"
          if jq -e . "$health" >/dev/null 2>&1; then
            jq -c '{ok,session}' "$health" > "$safe"
          else
            printf '{"httpCode":"%s","parse":"failed"}\n' "$code" > "$safe"
          fi

          if [ "$code" != "200" ]; then
            echo "Production identity health returned HTTP $code" >&2
            cat "$safe" >&2
            exit 1
          fi

          jq -e '.session.ready == true and .session.source == "configured"' "$health" >/dev/null || {
            echo "Production does not report a dedicated configured NEYVIX_SESSION_SECRET." >&2
            cat "$safe" >&2
            exit 1
          }

          echo "PASS: current production reports a dedicated configured session secret without exposing its value."
          {
            echo "### Production Session Secret Preflight: PASS"
            echo
            echo "Current production identity health confirms an explicit configured session secret."
          } >> "$GITHUB_STEP_SUMMARY"

  session-secret-preview-smoke:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Acquire GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify dedicated session secret on preview
        shell: bash
        env:
          VERCEL_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          base="${PREVIEW_URL%/}"
          health=/tmp/identity-health.json
          safe=/tmp/identity-health-safe.json
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o "$health" -w '%{http_code}' "$base/api/health/identity")"
          if jq -e . "$health" >/dev/null 2>&1; then
            jq -c '{ok,session}' "$health" > "$safe"
          else
            printf '{"httpCode":"%s","parse":"failed"}\n' "$code" > "$safe"
          fi

          if [ "$code" != "200" ]; then
            echo "Identity health returned HTTP $code" >&2
            cat "$safe" >&2
            exit 1
          fi

          jq -e '.session.ready == true and .session.source == "configured"' "$health" >/dev/null || {
            echo "Preview does not report a dedicated configured NEYVIX_SESSION_SECRET." >&2
            cat "$safe" >&2
            exit 1
          }

          echo "PASS: preview reports a dedicated configured session secret without exposing its value."
          {
            echo "### Session Secret Preview Smoke: PASS"
            echo
            echo "Preview identity health confirms an explicit configured session secret."
          } >> "$GITHUB_STEP_SUMMARY"
