name: NEYVIX Intelligence Smoke

on:
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  intelligence:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEYVIX_PRODUCTION_CANDIDATE: https://neyvix.vercel.app
    steps:
      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vercel"
          token="$(curl --silent --show-error --fail -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value // empty')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify AI and Memory readiness
        shell: bash
        run: |
          set -euo pipefail
          base="${NEYVIX_PRODUCTION_CANDIDATE%/}"
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi
          code="$(curl --silent --show-error --location --retry 3 --retry-delay 2 --max-time 20 "${headers[@]}" -o /tmp/intelligence.json -w '%{http_code}' "$base/api/health/intelligence")"
          echo "Intelligence HTTP: $code"
          jq '{ok,service,status,database,ai,memory}' /tmp/intelligence.json
          test "$code" = "200"
          jq -e '.ok == true and .database == "connected" and .ai.messageStore == true and .memory.store == true and .memory.events == true' /tmp/intelligence.json >/dev/null

      - name: Verify anonymous intelligence boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="${NEYVIX_PRODUCTION_CANDIDATE%/}"
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          ai_get="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/ai-get.json -w '%{http_code}' "$base/api/ai")"
          ai_post="$(curl --silent --show-error --max-time 20 "${headers[@]}" -H 'Content-Type: application/json' -d '{"prompt":"health boundary"}' -o /tmp/ai-post.json -w '%{http_code}' "$base/api/ai")"
          memory_get="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/memory-get.json -w '%{http_code}' "$base/api/memory")"
          memory_post="$(curl --silent --show-error --max-time 20 "${headers[@]}" -D /tmp/memory-post.headers -o /tmp/memory-post.body -w '%{http_code}' -X POST "$base/api/memory")"
          memory_suggest="$(curl --silent --show-error --max-time 20 "${headers[@]}" -H 'Content-Type: application/json' -d '{"text":"health boundary"}' -o /tmp/memory-suggest.json -w '%{http_code}' "$base/api/memory/suggest")"
          memory_delete="$(curl --silent --show-error --max-time 20 "${headers[@]}" -D /tmp/memory-delete.headers -o /tmp/memory-delete.body -w '%{http_code}' -X POST "$base/api/memory/delete")"

          echo "AI GET anonymous HTTP: $ai_get"
          echo "AI POST anonymous HTTP: $ai_post"
          echo "Memory GET anonymous HTTP: $memory_get"
          echo "Memory POST anonymous HTTP: $memory_post"
          echo "Memory suggest anonymous HTTP: $memory_suggest"
          echo "Memory delete anonymous HTTP: $memory_delete"

          test "$ai_get" = "401"
          test "$ai_post" = "401"
          test "$memory_get" = "401"
          test "$memory_post" = "303"
          test "$memory_suggest" = "401"
          test "$memory_delete" = "303"
          jq -e '.error | type == "string"' /tmp/ai-get.json >/dev/null
          jq -e '.error | type == "string"' /tmp/ai-post.json >/dev/null
          jq -e '.error | type == "string"' /tmp/memory-get.json >/dev/null
          jq -e '.error | type == "string"' /tmp/memory-suggest.json >/dev/null
          grep -Fiq '/login?next=/memory' /tmp/memory-post.headers
          grep -Fiq '/login?next=/memory' /tmp/memory-delete.headers
