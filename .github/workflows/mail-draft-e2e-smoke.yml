name: NEYVIX Mail Draft E2E Smoke

on:
  push:
    branches: [main]
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  mail-draft-e2e:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEYVIX_PRODUCTION_URL: https://neyvix.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vercel"
          token="$(curl --silent --show-error --fail -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value // empty')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify inert Mail draft lifecycle in production
        shell: bash
        run: |
          set -euo pipefail
          base="${NEYVIX_PRODUCTION_URL%/}"
          cookies=/tmp/neyvix-mail-draft-cookies.txt
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          fail_stage() {
            local stage="$1"
            echo "NEYVIX_MAIL_DRAFT_STAGE_FAIL=$stage" >&2
            echo "::error title=NEYVIX Mail Draft E2E::${stage}"
            {
              echo "### Mail Draft E2E Smoke: FAIL"
              echo
              echo "- Stage: \`$stage\`"
              echo "- Production: \`$base\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          account_registered=false
          cleanup() {
            set +e
            if [ "$account_registered" = true ] && [ -s "$cookies" ]; then
              if [ -n "${draft_id:-}" ]; then
                curl --silent --max-time 15 "${headers[@]}" -b "$cookies" -X DELETE "$base/api/mail/drafts?id=$draft_id" >/dev/null 2>&1 || true
              fi
              curl --silent --max-time 15 "${headers[@]}" -b "$cookies" -X DELETE "$base/api/auth/smoke-cleanup" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          anonymous_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/mail-draft-anon.json -w '%{http_code}' "$base/api/mail/drafts")" || fail_stage anonymous-request
          [ "$anonymous_code" = "401" ] || fail_stage anonymous-isolation

          release_ready=false
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/health.json -w '%{http_code}' "$base/api/health" || true)"
            served_sha="$(jq -r '.release.sha // empty' /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && { [ "$served_sha" = "$GITHUB_SHA" ] || [[ "$GITHUB_SHA" == "$served_sha"* ]]; }; then
              release_ready=true
              break
            fi
            sleep 10
          done
          [ "$release_ready" = true ] || fail_stage production-release-sha-timeout
          jq -e '.checks.database == "connected" and .readiness.access == true' /tmp/health.json >/dev/null || fail_stage database-health

          handle="e2e-smoke-mail-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          email="${handle}@neyvix.com"
          password="$(openssl rand -base64 30 | tr -d '\n')"
          echo "::add-mask::$password"
          echo "::add-mask::$email"

          curl --silent --show-error --max-time 20 "${headers[@]}" \
            -H 'content-type: application/x-www-form-urlencoded' \
            -c "$cookies" -D /tmp/register.headers -o /tmp/register.body \
            --data-urlencode 'name=NEYVIX Mail Draft E2E' \
            --data-urlencode "handle=$handle" \
            --data-urlencode "password=$password" \
            --data-urlencode 'plan=start' \
            "$base/api/auth/register" >/dev/null || fail_stage register-request
          register_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/register.headers)"
          [ "$register_status" = "303" ] || fail_stage register-status
          grep -Eq 'neyvix_session' "$cookies" || fail_stage session-cookie
          account_registered=true

          subject="NEYVIX Mail Draft Smoke ${GITHUB_RUN_ID}"
          body="Internal inert draft created by production E2E; never sent."
          create_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" \
            -H 'content-type: application/json' \
            -D /tmp/mail-draft-create.headers -o /tmp/mail-draft-create.json -w '%{http_code}' \
            --data "$(jq -nc --arg to "$email" --arg subject "$subject" --arg text "$body" '{to:$to,subject:$subject,text:$text}')" \
            "$base/api/mail/drafts")" || fail_stage draft-create-request
          [ "$create_code" = "201" ] || {
            if [ "$create_code" = "403" ] && jq -e '.reason == "upgrade_required"' /tmp/mail-draft-create.json >/dev/null 2>&1; then
              fail_stage draft-entitlement-blocked
            fi
            fail_stage draft-create-status
          }
          jq -e '.ok == true and (.draft.id | type == "string")' /tmp/mail-draft-create.json >/dev/null || fail_stage draft-create-payload
          draft_id="$(jq -r '.draft.id' /tmp/mail-draft-create.json)"

          list_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" \
            -D /tmp/mail-draft-list.headers -o /tmp/mail-draft-list.json -w '%{http_code}' \
            "$base/api/mail/drafts")" || fail_stage draft-list-request
          [ "$list_code" = "200" ] || fail_stage draft-list-status
          jq -e --arg id "$draft_id" --arg subject "$subject" '.folder == "draft" and (.drafts | type == "array") and any(.drafts[]; .id == $id and .subject == $subject and .folder == "draft")' /tmp/mail-draft-list.json >/dev/null || fail_stage draft-persistence
          grep -Eiq '^cache-control: .*no-store' /tmp/mail-draft-list.headers || fail_stage draft-private-cache-control

          delete_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" \
            -X DELETE -o /tmp/mail-draft-delete.json -w '%{http_code}' \
            "$base/api/mail/drafts?id=$draft_id")" || fail_stage draft-delete-request
          [ "$delete_code" = "200" ] || fail_stage draft-delete-status
          jq -e --arg id "$draft_id" '.ok == true and .deletedId == $id' /tmp/mail-draft-delete.json >/dev/null || fail_stage draft-delete-payload
          draft_id=""

          verify_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -o /tmp/mail-draft-verify.json -w '%{http_code}' "$base/api/mail/drafts")" || fail_stage draft-verify-request
          [ "$verify_code" = "200" ] || fail_stage draft-verify-status
          jq -e --arg subject "$subject" 'all(.drafts[]; .subject != $subject)' /tmp/mail-draft-verify.json >/dev/null || fail_stage draft-delete-persistence

          cleanup_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -X DELETE -o /tmp/smoke-cleanup.json -w '%{http_code}' "$base/api/auth/smoke-cleanup")" || fail_stage smoke-account-cleanup-request
          [ "$cleanup_code" = "200" ] || fail_stage smoke-account-cleanup-status
          jq -e '.ok == true' /tmp/smoke-cleanup.json >/dev/null || fail_stage smoke-account-cleanup-payload
          account_registered=false

          {
            echo "### Mail Draft E2E Smoke: PASS"
            echo
            echo "Verified anonymous denial, production release SHA, NEYVIX ID/session, inert draft create/list persistence/delete, private cache headers, and ephemeral-account cleanup."
            echo "This smoke never calls /api/mail/send and performs no external mail delivery, billing mutation, payment, webhook, AI generation or destructive migration."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: inert Mail draft lifecycle verified in production."
