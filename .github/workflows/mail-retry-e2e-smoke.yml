name: NEYVIX Mail Retry E2E Smoke

on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  mail-retry-e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEYVIX_PRODUCTION_URL: https://neyvix.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vercel"
          token="$(curl --silent --show-error --fail -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value // empty')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify Mail retry state machine in production without external transport
        shell: bash
        run: |
          set -euo pipefail
          base="${NEYVIX_PRODUCTION_URL%/}"
          cookies=/tmp/neyvix-mail-retry-cookies.txt
          headers=(
            -H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}"
            -H "x-neyvix-github-oidc: ${VERCEL_OIDC_TOKEN}"
          )
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          fail_stage() {
            local stage="$1"
            echo "NEYVIX_MAIL_RETRY_STAGE_FAIL=$stage" >&2
            echo "::error title=NEYVIX Mail Retry E2E::${stage}"
            exit 1
          }

          account_registered=false
          cleanup() {
            set +e
            if [ "$account_registered" = true ] && [ -s "$cookies" ]; then
              curl --silent --max-time 15 "${headers[@]}" -b "$cookies" -X DELETE "$base/api/auth/smoke-cleanup" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          release_ready=false
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/health.json -w '%{http_code}' "$base/api/health" || true)"
            served_sha="$(jq -r '.release.sha // empty' /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && { [ "$served_sha" = "$GITHUB_SHA" ] || [[ "$GITHUB_SHA" == "$served_sha"* ]]; }; then
              release_ready=true
              break
            fi
            sleep 10
          done
          [ "$release_ready" = true ] || fail_stage production-release-sha-timeout
          jq -e '.checks.database == "connected" and .readiness.access == true' /tmp/health.json >/dev/null || fail_stage database-health

          handle="business-positive-mail-retry-${GITHUB_RUN_ID}"
          email="${handle}@neyvix.com"
          password="$(openssl rand -base64 30 | tr -d '\n')"
          nonce="mail-retry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "::add-mask::$password"
          echo "::add-mask::$email"

          curl --silent --show-error --max-time 20 "${headers[@]}" \
            -H 'content-type: application/x-www-form-urlencoded' \
            -c "$cookies" -D /tmp/register.headers -o /tmp/register.body \
            --data-urlencode 'name=NEYVIX Mail Retry E2E' \
            --data-urlencode "handle=$handle" \
            --data-urlencode "password=$password" \
            --data-urlencode 'plan=start' \
            "$base/api/auth/register" >/dev/null || fail_stage register-request
          register_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/register.headers)"
          [ "$register_status" = "303" ] || fail_stage register-status
          grep -Eq 'neyvix_session' "$cookies" || fail_stage session-cookie
          account_registered=true

          grant_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" \
            -H 'content-type: application/json' -o /tmp/grant.json -w '%{http_code}' \
            --data "$(jq -nc --arg nonce "$nonce" '{nonce:$nonce}')" \
            "$base/api/billing/smoke-business")" || fail_stage grant-request
          [ "$grant_code" = "200" ] || fail_stage grant-status
          jq -e '.ok == true and .externalPayment == false and .billing.plan == "business" and (.billing.entitlements | index("mail")) != null' /tmp/grant.json >/dev/null || fail_stage grant-payload

          smoke_code="$(curl --silent --show-error --max-time 30 "${headers[@]}" -b "$cookies" \
            -H 'content-type: application/json' -o /tmp/mail-retry.json -w '%{http_code}' \
            --data '{}' "$base/api/mail/smoke-retry")" || fail_stage retry-smoke-request
          [ "$smoke_code" = "200" ] || fail_stage retry-smoke-status
          jq -e '
            .ok == true and
            .testOnly == true and
            .externalTransport == false and
            .externalPayment == false and
            .checks.reservedPending == true and
            .checks.definitiveFailureRecorded == true and
            .checks.failedRetryAllowed == true and
            .checks.idempotencyKeyReused == true and
            .checks.canonicalPayloadImmutable == true and
            .checks.pendingReplayBlocked == true and
            .checks.sentReplaySuppressed == true
          ' /tmp/mail-retry.json >/dev/null || fail_stage retry-smoke-payload

          cancel_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" \
            -H 'content-type: application/json' -o /tmp/cancel.json -w '%{http_code}' \
            --data "$(jq -nc --arg nonce "$nonce" '{nonce:$nonce,action:"cancel"}')" \
            "$base/api/billing/smoke-business")" || fail_stage cancel-request
          [ "$cancel_code" = "200" ] || fail_stage cancel-status
          jq -e '.ok == true and .externalPayment == false and .billing.plan == "expired" and (.billing.entitlements | index("mail")) == null' /tmp/cancel.json >/dev/null || fail_stage cancel-payload

          cleanup_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -X DELETE -o /tmp/smoke-cleanup.json -w '%{http_code}' "$base/api/auth/smoke-cleanup")" || fail_stage cleanup-request
          [ "$cleanup_code" = "200" ] || fail_stage cleanup-status
          jq -e '.ok == true' /tmp/smoke-cleanup.json >/dev/null || fail_stage cleanup-payload
          account_registered=false

          {
            echo "### Mail Retry E2E Smoke: PASS"
            echo
            echo "Verified exact production release SHA, connected database, disposable Business entitlement, pending reservation, confirmed failed state, manual failed→pending retry, reuse of the same idempotency key, immutable canonical payload, pending replay suppression, sent replay suppression, entitlement revocation, and cleanup."
            echo "No external Mail transport, real email, checkout, payment, external billing provider, external AI generation, or destructive schema migration is invoked."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: Mail retry state machine verified in production without external delivery."
