name: NEYVIX Business Entitlement Negative E2E Smoke

on:
  push:
    branches: [main]
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  business-entitlement-negative-e2e:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEYVIX_PRODUCTION_URL: https://neyvix.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vercel"
          token="$(curl --silent --show-error --fail -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value // empty')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify Business-only resources reject trial users in production
        shell: bash
        run: |
          set -euo pipefail
          base="${NEYVIX_PRODUCTION_URL%/}"
          cookies=/tmp/neyvix-business-negative-cookies.txt
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          fail_stage() {
            local stage="$1"
            echo "NEYVIX_BUSINESS_NEGATIVE_STAGE_FAIL=$stage" >&2
            echo "::error title=NEYVIX Business Entitlement Negative E2E::${stage}"
            exit 1
          }

          account_registered=false
          cleanup() {
            set +e
            if [ "$account_registered" = true ] && [ -s "$cookies" ]; then
              curl --silent --max-time 15 "${headers[@]}" -b "$cookies" -X DELETE "$base/api/auth/smoke-cleanup" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          release_ready=false
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/health.json -w '%{http_code}' "$base/api/health" || true)"
            served_sha="$(jq -r '.release.sha // empty' /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && { [ "$served_sha" = "$GITHUB_SHA" ] || [[ "$GITHUB_SHA" == "$served_sha"* ]]; }; then
              release_ready=true
              break
            fi
            sleep 10
          done
          [ "$release_ready" = true ] || fail_stage production-release-sha-timeout
          jq -e '.checks.database == "connected" and .readiness.access == true' /tmp/health.json >/dev/null || fail_stage database-health

          handle="business-negative-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          email="${handle}@neyvix.com"
          password="$(openssl rand -base64 30 | tr -d '\n')"
          echo "::add-mask::$password"
          echo "::add-mask::$email"

          curl --silent --show-error --max-time 20 "${headers[@]}" \
            -H 'content-type: application/x-www-form-urlencoded' \
            -c "$cookies" -D /tmp/register.headers -o /tmp/register.body \
            --data-urlencode 'name=NEYVIX Business Negative E2E' \
            --data-urlencode "handle=$handle" \
            --data-urlencode "password=$password" \
            --data-urlencode 'plan=start' \
            "$base/api/auth/register" >/dev/null || fail_stage register-request
          register_status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/register.headers)"
          [ "$register_status" = "303" ] || fail_stage register-status
          grep -Eq 'neyvix_session' "$cookies" || fail_stage session-cookie
          account_registered=true

          billing_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -o /tmp/billing.json -w '%{http_code}' "$base/api/billing/entitlements")" || fail_stage billing-request
          [ "$billing_code" = "200" ] || fail_stage billing-status
          jq -e '.billing.plan == "trial" and .billing.status == "trialing" and (.entitlements | index("automation")) != null and (.entitlements | index("approvals")) == null and (.entitlements | index("mail")) == null and (.entitlements | index("admin")) == null' /tmp/billing.json >/dev/null || fail_stage trial-business-exclusion

          approvals_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -o /tmp/approvals.json -w '%{http_code}' "$base/api/automation/approvals")" || fail_stage approvals-request
          [ "$approvals_code" = "403" ] || fail_stage approvals-must-be-forbidden

          mail_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -o /tmp/mail.json -w '%{http_code}' "$base/api/mail/drafts")" || fail_stage mail-request
          [ "$mail_code" = "403" ] || fail_stage mail-must-be-forbidden

          cleanup_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies" -X DELETE -o /tmp/smoke-cleanup.json -w '%{http_code}' "$base/api/auth/smoke-cleanup")" || fail_stage cleanup-request
          [ "$cleanup_code" = "200" ] || fail_stage cleanup-status
          jq -e '.ok == true' /tmp/smoke-cleanup.json >/dev/null || fail_stage cleanup-payload
          account_registered=false

          {
            echo "### Business Entitlement Negative E2E Smoke: PASS"
            echo
            echo "Verified exact production release SHA, database health, real trial identity/session, Business feature exclusion, Approvals 403, Mail drafts 403, and cleanup."
            echo "No Business subscription is fabricated. No checkout, webhook, provider mutation, payment, mail delivery, external AI generation, or destructive database operation is invoked."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: Business-only resources reject trial users in production."
