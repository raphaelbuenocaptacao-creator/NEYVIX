name: NEYVIX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Migration order contract
        run: node scripts/verify-migration-order-contract.mjs

      - name: Auth SQL contract
        run: node scripts/verify-auth-sql-contract.mjs

      - name: Identity privacy contract
        run: node scripts/verify-auth-me-privacy-contract.mjs

      - name: Magic login security contract
        run: node scripts/verify-magic-login-contract.mjs

      - name: Billing safety contract
        run: node scripts/verify-billing-contract.mjs

      - name: Mail transport safety contract
        run: node scripts/verify-mail-transport-contract.mjs

      - name: Intelligence security contract
        run: node scripts/verify-intelligence-contract.mjs

      - name: Memory privacy contract
        run: node scripts/verify-memory-privacy-contract.mjs

      - name: Studio and Content ownership contract
        run: node scripts/verify-product-records-contract.mjs

      - name: Drive ownership contract
        run: node scripts/verify-drive-contract.mjs

      - name: Docs ownership and version contract
        run: node scripts/verify-docs-contract.mjs

      - name: Drive and Docs additive repair contract
        run: node scripts/verify-drive-docs-repair-contract.mjs

      - name: Drive and Docs schema shape contract
        run: node scripts/verify-drive-docs-shape-contract.mjs

      - name: Guarded schema repair endpoint contract
        run: node scripts/verify-schema-repair-endpoint-contract.mjs

      - name: Guarded schema repair UI contract
        run: node scripts/verify-schema-repair-ui-contract.mjs

      - name: Health schema readiness contract
        run: node scripts/verify-health-schema-contract.mjs

      - name: Health readiness truth contract
        run: node scripts/verify-health-readiness-truth-contract.mjs

      - name: Health actionable blockers contract
        run: node scripts/verify-health-blockers-contract.mjs

      - name: Health release traceability contract
        run: node scripts/verify-health-release-contract.mjs

      - name: Approval authorization contract
        run: node scripts/verify-approval-authorization-contract.mjs

      - name: Automation lifecycle contract
        run: node scripts/verify-automation-lifecycle-contract.mjs

      - name: Admin and User 360 authorization contract
        run: node scripts/verify-admin-user360-contract.mjs

      - name: Command Center authorization contract
        run: node scripts/verify-command-center-authorization-contract.mjs

      - name: Readiness smoke check
        run: npm run smoke

      - name: Build
        run: npm run build
