name: NEYVIX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Auth SQL contract
        run: node scripts/verify-auth-sql-contract.mjs

      - name: Billing safety contract
        run: node scripts/verify-billing-contract.mjs

      - name: Mail transport safety contract
        run: node scripts/verify-mail-transport-contract.mjs

      - name: Intelligence security contract
        run: node scripts/verify-intelligence-contract.mjs

      - name: Studio and Content ownership contract
        run: node scripts/verify-product-records-contract.mjs

      - name: Approval authorization contract
        run: node scripts/verify-approval-authorization-contract.mjs

      - name: Automation lifecycle contract
        run: node scripts/verify-automation-lifecycle-contract.mjs

      - name: Readiness smoke check
        run: npm run smoke

      - name: Build
        run: npm run build
