name: NEYVIX AI Memory Context E2E Smoke

on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  ai-memory-context-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEYVIX_PRODUCTION_URL: https://neyvix.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vercel"
          token="$(curl --silent --show-error --fail -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value // empty')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify Memory privacy and delete lifecycle
        shell: bash
        run: |
          set -euo pipefail
          base="${NEYVIX_PRODUCTION_URL%/}"
          cookies_file=/tmp/neyvix-memory.cookies
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          fail_stage() {
            echo "NEYVIX_MEMORY_LIFECYCLE_STAGE_FAIL=$1" >&2
            echo "::error title=NEYVIX Memory Lifecycle E2E::$1"
            exit 1
          }

          account_registered=false
          cleanup() {
            set +e
            if [ "$account_registered" = true ] && [ -s "$cookies_file" ]; then
              curl --silent --max-time 15 "${headers[@]}" -b "$cookies_file" -X DELETE "$base/api/auth/smoke-cleanup" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          release_ready=false
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/health.json -w '%{http_code}' "$base/api/health" || true)"
            served_sha="$(jq -r '.release.sha // empty' /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && { [ "$served_sha" = "$GITHUB_SHA" ] || [[ "$GITHUB_SHA" == "$served_sha"* ]]; }; then
              release_ready=true
              break
            fi
            sleep 10
          done
          [ "$release_ready" = true ] || fail_stage production-release-sha-timeout
          jq -e '.checks.database == "connected"' /tmp/health.json >/dev/null || fail_stage database-health

          anon_patch="$(curl --silent --show-error --max-time 20 "${headers[@]}" -X PATCH -H 'content-type: application/json' -d '{"id":"00000000-0000-4000-8000-000000000000","shareWithAi":false}' -o /tmp/anon-patch.json -w '%{http_code}' "$base/api/memory")" || fail_stage anonymous-patch-request
          [ "$anon_patch" = "401" ] || fail_stage anonymous-patch-not-blocked
          anon_delete="$(curl --silent --show-error --max-time 20 "${headers[@]}" -X DELETE -H 'content-type: application/json' -d '{"id":"00000000-0000-4000-8000-000000000000"}' -o /tmp/anon-delete.json -w '%{http_code}' "$base/api/memory")" || fail_stage anonymous-delete-request
          [ "$anon_delete" = "401" ] || fail_stage anonymous-delete-not-blocked

          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          handle="e2e-memory-${suffix}"
          email="${handle}@neyvix.com"
          password="$(openssl rand -base64 30 | tr -d '\n')"
          echo "::add-mask::$email"
          echo "::add-mask::$password"

          registered=false
          for register_attempt in $(seq 1 5); do
            rm -f "$cookies_file" /tmp/register.headers /tmp/register.body
            curl --silent --show-error --max-time 20 "${headers[@]}" \
              -H 'content-type: application/x-www-form-urlencoded' \
              -c "$cookies_file" -D /tmp/register.headers -o /tmp/register.body \
              --data-urlencode 'name=NEYVIX Memory Lifecycle E2E' \
              --data-urlencode "handle=$handle" \
              --data-urlencode "password=$password" \
              --data-urlencode 'plan=start' \
              "$base/api/auth/register" >/dev/null || fail_stage register-request
            status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/register.headers)"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub(/\r/,"",$0); sub(/^[^:]+:[[:space:]]*/,"",$0); print $0}' /tmp/register.headers | tail -1)"
            [ "$status" = "303" ] || fail_stage register-status
            if grep -Eq 'neyvix_session' "$cookies_file" 2>/dev/null; then
              case "$location" in */dashboard*) registered=true; break ;; *) fail_stage register-redirect ;; esac
            fi
            case "$location" in */register?error=rate_limit*) sleep $((register_attempt * 7)) ;; *) fail_stage register-session-cookie ;; esac
          done
          [ "$registered" = true ] || fail_stage register-rate-limit-exhausted
          account_registered=true

          me_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_file" -o /tmp/me.json -w '%{http_code}' "$base/api/auth/me")" || fail_stage session-request
          [ "$me_code" = "200" ] || fail_stage session-status
          jq -e --arg email "$email" '.authenticated == true and .user.email == $email' /tmp/me.json >/dev/null || fail_stage session-identity

          memory_key="memory-lifecycle-${suffix}"
          memory_value="Lifecycle sentinel ${suffix}"
          create_status="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_file" -D /tmp/create.headers -o /tmp/create.body -w '%{http_code}' \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode "key=$memory_key" --data-urlencode 'category=e2e-memory' --data-urlencode "value=$memory_value" --data-urlencode 'shareWithAi=on' \
            "$base/api/memory")" || fail_stage memory-create-request
          [ "$create_status" = "303" ] || fail_stage memory-create-status
          grep -Eiq '^location: .*/memory\?saved=1&shared=1' /tmp/create.headers || fail_stage memory-create-shared-result

          list_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_file" -D /tmp/list.headers -o /tmp/list.json -w '%{http_code}' "$base/api/memory")" || fail_stage memory-list-request
          [ "$list_code" = "200" ] || fail_stage memory-list-status
          grep -Eiq '^cache-control: .*no-store' /tmp/list.headers || fail_stage memory-list-cache-policy
          grep -Eiq '^referrer-policy: no-referrer' /tmp/list.headers || fail_stage memory-list-referrer-policy
          memory_id="$(jq -r --arg key "$memory_key" '.memories[] | select(.key == $key and .isPrivate == false) | .id' /tmp/list.json | head -n1)"
          [[ "$memory_id" =~ ^[0-9a-fA-F-]{36}$ ]] || fail_stage memory-id
          jq -e --arg id "$memory_id" --arg key "$memory_key" '.events | any(.action == "upsert" and .metadata.key == $key and .metadata.shared_with_ai == true)' /tmp/list.json >/dev/null || fail_stage upsert-audit-event

          context_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_file" -o /tmp/context-shared.json -w '%{http_code}' "$base/api/ai/context?useMemory=true")" || fail_stage shared-context-request
          [ "$context_code" = "200" ] || fail_stage shared-context-status
          memory_enabled="$(jq -r '.memoryContextEnabled' /tmp/context-shared.json)"
          if [ "$memory_enabled" = "true" ]; then
            jq -e '.requestMemoryOptIn == true and .memoryUsed >= 1 and .contextAvailable == true' /tmp/context-shared.json >/dev/null || fail_stage shared-context-not-used
          else
            jq -e '.requestMemoryOptIn == true and .memoryUsed == 0 and .contextAvailable == false' /tmp/context-shared.json >/dev/null || fail_stage shared-context-not-fail-closed
          fi
          if grep -Fq "$memory_value" /tmp/context-shared.json; then fail_stage raw-memory-value-exposed; fi

          patch_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_file" -X PATCH -H 'content-type: application/json' \
            --data "$(jq -nc --arg id "$memory_id" '{id:$id,shareWithAi:false}')" -D /tmp/patch.headers -o /tmp/patch.json -w '%{http_code}' "$base/api/memory")" || fail_stage privacy-patch-request
          [ "$patch_code" = "200" ] || fail_stage privacy-patch-status
          grep -Eiq '^cache-control: .*no-store' /tmp/patch.headers || fail_stage privacy-patch-cache-policy
          grep -Eiq '^referrer-policy: no-referrer' /tmp/patch.headers || fail_stage privacy-patch-referrer-policy
          jq -e --arg id "$memory_id" '.ok == true and .id == $id and .shareWithAi == false' /tmp/patch.json >/dev/null || fail_stage privacy-patch-contract

          after_patch_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_file" -o /tmp/after-patch.json -w '%{http_code}' "$base/api/memory")" || fail_stage after-patch-list-request
          [ "$after_patch_code" = "200" ] || fail_stage after-patch-list-status
          jq -e --arg id "$memory_id" --arg key "$memory_key" '(.memories | any(.id == $id and .isPrivate == true)) and (.events | any(.action == "privacy" and .metadata.key == $key and .metadata.shared_with_ai == false))' /tmp/after-patch.json >/dev/null || fail_stage privacy-not-persisted-or-audited

          private_context_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_file" -o /tmp/context-private.json -w '%{http_code}' "$base/api/ai/context?useMemory=true")" || fail_stage private-context-request
          [ "$private_context_code" = "200" ] || fail_stage private-context-status
          jq -e --argjson enabled "$memory_enabled" '.memoryContextEnabled == $enabled and .requestMemoryOptIn == true and .memoryUsed == 0 and .contextAvailable == false' /tmp/context-private.json >/dev/null || fail_stage private-memory-not-excluded

          delete_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_file" -X DELETE -H 'content-type: application/json' \
            --data "$(jq -nc --arg id "$memory_id" '{id:$id}')" -D /tmp/delete.headers -o /tmp/delete.json -w '%{http_code}' "$base/api/memory")" || fail_stage memory-delete-request
          [ "$delete_code" = "200" ] || fail_stage memory-delete-status
          grep -Eiq '^cache-control: .*no-store' /tmp/delete.headers || fail_stage memory-delete-cache-policy
          grep -Eiq '^referrer-policy: no-referrer' /tmp/delete.headers || fail_stage memory-delete-referrer-policy
          jq -e --arg id "$memory_id" '.ok == true and .id == $id' /tmp/delete.json >/dev/null || fail_stage memory-delete-contract

          final_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_file" -o /tmp/final.json -w '%{http_code}' "$base/api/memory")" || fail_stage final-list-request
          [ "$final_code" = "200" ] || fail_stage final-list-status
          jq -e --arg id "$memory_id" --arg key "$memory_key" '(.memories | all(.id != $id)) and (.events | any(.action == "delete" and .metadata.key == $key))' /tmp/final.json >/dev/null || fail_stage deletion-not-persisted-or-audited

          repeat_delete="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_file" -X DELETE -H 'content-type: application/json' --data "$(jq -nc --arg id "$memory_id" '{id:$id}')" -o /tmp/repeat-delete.json -w '%{http_code}' "$base/api/memory")" || fail_stage repeat-delete-request
          [ "$repeat_delete" = "404" ] || fail_stage repeat-delete-not-idempotent-safe

          cleanup_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_file" -X DELETE -o /tmp/cleanup.json -w '%{http_code}' "$base/api/auth/smoke-cleanup")" || fail_stage cleanup-request
          [ "$cleanup_code" = "200" ] || fail_stage cleanup-status
          jq -e '.ok == true' /tmp/cleanup.json >/dev/null || fail_stage cleanup-payload
          account_registered=false

          {
            echo "### NEYVIX Memory Lifecycle E2E: PASS"
            echo
            echo "Verified exact production release, authenticated Start entitlement, shared memory creation, AI-context opt-in contract, PATCH privacy control, private-context exclusion, DELETE removal, audit events, private response headers, anonymous denial and cleanup."
            if [ "$memory_enabled" = "true" ]; then
              echo "Memory context feature gate enabled: shared recall and subsequent exclusion were verified."
            else
              echo "Memory context feature gate disabled: fail-closed behavior and lifecycle controls were verified."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: NEYVIX Memory privacy/delete lifecycle verified in production."
