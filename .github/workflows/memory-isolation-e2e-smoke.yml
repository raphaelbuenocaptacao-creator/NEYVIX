name: NEYVIX Memory Isolation E2E Smoke

on:
  push:
    branches: [main]
  deployment_status:

permissions:
  contents: read
  id-token: write

jobs:
  memory-isolation-e2e:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEYVIX_PRODUCTION_URL: https://neyvix.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Acquire GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vercel"
          token="$(curl --silent --show-error --fail -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r '.value // empty')"
          test -n "$token"
          echo "::add-mask::$token"
          echo "VERCEL_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Verify Memory persistence and cross-user isolation
        shell: bash
        run: |
          set -euo pipefail
          base="${NEYVIX_PRODUCTION_URL%/}"
          cookies_a=/tmp/neyvix-memory-a.cookies
          cookies_b=/tmp/neyvix-memory-b.cookies
          headers=(-H "x-vercel-trusted-oidc-idp-token: ${VERCEL_OIDC_TOKEN}")
          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            headers+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          fail_stage() {
            local stage="$1"
            echo "NEYVIX_MEMORY_ISOLATION_STAGE_FAIL=$stage" >&2
            echo "::error title=NEYVIX Memory Isolation E2E::${stage}"
            {
              echo "### Memory Isolation E2E Smoke: FAIL"
              echo
              echo "- Stage: \`$stage\`"
              echo "- Production: \`$base\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          account_a_registered=false
          account_b_registered=false
          cleanup() {
            set +e
            if [ "$account_a_registered" = true ] && [ -s "$cookies_a" ]; then
              curl --silent --max-time 15 "${headers[@]}" -b "$cookies_a" -X DELETE "$base/api/auth/smoke-cleanup" >/dev/null 2>&1 || true
            fi
            if [ "$account_b_registered" = true ] && [ -s "$cookies_b" ]; then
              curl --silent --max-time 15 "${headers[@]}" -b "$cookies_b" -X DELETE "$base/api/auth/smoke-cleanup" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          release_ready=false
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/health.json -w '%{http_code}' "$base/api/health" || true)"
            served_sha="$(jq -r '.release.sha // empty' /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ] && { [ "$served_sha" = "$GITHUB_SHA" ] || [[ "$GITHUB_SHA" == "$served_sha"* ]]; }; then
              release_ready=true
              break
            fi
            sleep 10
          done
          [ "$release_ready" = true ] || fail_stage production-release-sha-timeout
          jq -e '.checks.database == "connected"' /tmp/health.json >/dev/null || fail_stage database-health

          memory_health_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -o /tmp/memory-health.json -w '%{http_code}' "$base/api/health/memory")" || fail_stage memory-health-request
          [ "$memory_health_code" = "200" ] || fail_stage memory-health-status
          jq -e '.ok == true and .checks.database == "connected" and .checks.memoryTable == true and .checks.eventsTable == true and .checks.userOwnership == true and .checks.privacy == true and .checks.expiration == true and .checks.auditEvents == true' /tmp/memory-health.json >/dev/null || fail_stage memory-health-readiness

          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          handle_a="e2e-smoke-memory-a-${suffix}"
          handle_b="e2e-smoke-memory-b-${suffix}"
          email_a="${handle_a}@neyvix.com"
          email_b="${handle_b}@neyvix.com"
          password_a="$(openssl rand -base64 30 | tr -d '\n')"
          password_b="$(openssl rand -base64 30 | tr -d '\n')"
          echo "::add-mask::$email_a"
          echo "::add-mask::$email_b"
          echo "::add-mask::$password_a"
          echo "::add-mask::$password_b"

          register_account() {
            local label="$1" handle="$2" password="$3" cookies="$4" headers_file="$5" body_file="$6"
            curl --silent --show-error --max-time 20 "${headers[@]}" -H 'content-type: application/x-www-form-urlencoded' -c "$cookies" -D "$headers_file" -o "$body_file" --data-urlencode "name=NEYVIX Memory E2E ${label}" --data-urlencode "handle=$handle" --data-urlencode "password=$password" --data-urlencode 'plan=start' "$base/api/auth/register" >/dev/null || fail_stage "register-${label}-request"
            local status
            status="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' "$headers_file")"
            [ "$status" = "303" ] || fail_stage "register-${label}-status"
            grep -Eq 'neyvix_session' "$cookies" || fail_stage "register-${label}-session-cookie"
          }

          register_account a "$handle_a" "$password_a" "$cookies_a" /tmp/register-a.headers /tmp/register-a.body
          account_a_registered=true
          register_account b "$handle_b" "$password_b" "$cookies_b" /tmp/register-b.headers /tmp/register-b.body
          account_b_registered=true

          me_a_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_a" -o /tmp/me-a.json -w '%{http_code}' "$base/api/auth/me")" || fail_stage session-a-request
          me_b_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_b" -o /tmp/me-b.json -w '%{http_code}' "$base/api/auth/me")" || fail_stage session-b-request
          [ "$me_a_code" = "200" ] || fail_stage session-a-status
          [ "$me_b_code" = "200" ] || fail_stage session-b-status
          jq -e --arg email "$email_a" '.authenticated == true and .user.email == $email' /tmp/me-a.json >/dev/null || fail_stage session-a-identity
          jq -e --arg email "$email_b" '.authenticated == true and .user.email == $email' /tmp/me-b.json >/dev/null || fail_stage session-b-identity

          key="memory-isolation-${suffix}-$(date +%s)"
          value="Private persistence proof ${suffix}"
          category="e2e-isolation"

          create_status="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_a" -D /tmp/memory-create.headers -o /tmp/memory-create.body -w '%{http_code}' -H 'content-type: application/x-www-form-urlencoded' --data-urlencode "key=$key" --data-urlencode "category=$category" --data-urlencode "value=$value" "$base/api/memory")" || fail_stage memory-create-request
          [ "$create_status" = "303" ] || fail_stage memory-create-status
          grep -Eiq '^location: .*/memory\?saved=1&shared=0' /tmp/memory-create.headers || fail_stage memory-create-private-redirect

          list_a_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_a" -o /tmp/memory-a.json -w '%{http_code}' "$base/api/memory")" || fail_stage memory-a-list-request
          [ "$list_a_code" = "200" ] || fail_stage memory-a-list-status
          jq -e --arg key "$key" --arg value "$value" --arg category "$category" '.memories | any(.key == $key and .value == $value and .category == $category and .isPrivate == true)' /tmp/memory-a.json >/dev/null || fail_stage memory-a-not-persisted
          memory_id="$(jq -r --arg key "$key" '.memories[] | select(.key == $key) | .id' /tmp/memory-a.json | head -n1)"
          [[ "$memory_id" =~ ^[0-9a-fA-F-]{36}$ ]] || fail_stage memory-a-id

          list_b_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_b" -o /tmp/memory-b.json -w '%{http_code}' "$base/api/memory")" || fail_stage memory-b-list-request
          [ "$list_b_code" = "200" ] || fail_stage memory-b-list-status
          jq -e --arg id "$memory_id" --arg key "$key" '(.memories | any(.id == $id or .key == $key)) | not' /tmp/memory-b.json >/dev/null || fail_stage memory-cross-user-visible

          delete_b_status="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_b" -D /tmp/delete-b.headers -o /tmp/delete-b.body -w '%{http_code}' -H 'content-type: application/x-www-form-urlencoded' --data-urlencode "id=$memory_id" "$base/api/memory/delete")" || fail_stage memory-b-delete-request
          [ "$delete_b_status" = "303" ] || fail_stage memory-b-delete-status
          grep -Eiq '^location: .*/memory\?error=not_found' /tmp/delete-b.headers || fail_stage memory-cross-user-delete-not-blocked

          curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_a" -o /tmp/memory-a-after-b-delete.json "$base/api/memory" || fail_stage memory-a-reload-request
          jq -e --arg id "$memory_id" --arg key "$key" '.memories | any(.id == $id and .key == $key)' /tmp/memory-a-after-b-delete.json >/dev/null || fail_stage memory-a-lost-after-b-delete

          delete_a_status="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_a" -D /tmp/delete-a.headers -o /tmp/delete-a.body -w '%{http_code}' -H 'content-type: application/x-www-form-urlencoded' --data-urlencode "id=$memory_id" "$base/api/memory/delete")" || fail_stage memory-a-delete-request
          [ "$delete_a_status" = "303" ] || fail_stage memory-a-delete-status
          grep -Eiq '^location: .*/memory\?deleted=1' /tmp/delete-a.headers || fail_stage memory-a-delete-result

          curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_a" -o /tmp/memory-a-after-delete.json "$base/api/memory" || fail_stage memory-a-post-delete-request
          jq -e --arg id "$memory_id" '(.memories | any(.id == $id)) | not' /tmp/memory-a-after-delete.json >/dev/null || fail_stage memory-a-delete-not-persisted

          cleanup_a_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_a" -X DELETE -o /tmp/cleanup-a.json -w '%{http_code}' "$base/api/auth/smoke-cleanup")" || fail_stage cleanup-a-request
          [ "$cleanup_a_code" = "200" ] || fail_stage cleanup-a-status
          jq -e '.ok == true' /tmp/cleanup-a.json >/dev/null || fail_stage cleanup-a-payload
          account_a_registered=false

          cleanup_b_code="$(curl --silent --show-error --max-time 20 "${headers[@]}" -b "$cookies_b" -X DELETE -o /tmp/cleanup-b.json -w '%{http_code}' "$base/api/auth/smoke-cleanup")" || fail_stage cleanup-b-request
          [ "$cleanup_b_code" = "200" ] || fail_stage cleanup-b-status
          jq -e '.ok == true' /tmp/cleanup-b.json >/dev/null || fail_stage cleanup-b-payload
          account_b_registered=false

          {
            echo "### Memory Isolation E2E Smoke: PASS"
            echo
            echo "Verified exact production release, database/Memory readiness, two real NEYVIX sessions, private Memory persistence, cross-user read isolation, cross-user delete isolation, owner deletion and ephemeral-account cleanup."
            echo "No billing, external mail, generation provider, real customer or schema mutation is used by this smoke."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: Memory persistence and cross-user isolation verified in production."
